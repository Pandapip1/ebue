name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'include/**'
      - 'arch/**'
      - 'tools/fuzz.sh'
      - 'tools/afl-fuzz.sh'
      - 'tools/asan-build.sh'
      - 'Makefile'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per harness
        required: false
        default: '300'
      harnesses:
        description: Harnesses (blank means all)
        required: false
        default: ''
      reset_corpus:
        description: Start with an empty corpus (yes/no)
        required: false
        default: 'no'

permissions:
  contents: read
  issues: write

# Push runs are a short regression net and only read the corpus.  Scheduled
# and manual runs are the search and are its only writers.
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore and save corpus
        id: corpus_rw
        if: ${{ github.event_name != 'push' && github.event.inputs.reset_corpus != 'yes' }}
        uses: actions/cache@v6
        with:
          path: obj/fuzzcorpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Restore corpus read-only
        id: corpus_ro
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/restore@v6
        with:
          path: obj/fuzzcorpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Report corpus restore
        shell: bash
        run: |
          mkdir -p obj/fuzzcorpus
          matched='${{ steps.corpus_rw.outputs.cache-matched-key }}${{ steps.corpus_ro.outputs.cache-matched-key }}'
          count=$(find obj/fuzzcorpus -type f | wc -l)
          echo "corpus: $count file(s) restored from '${matched:-<none>}'"
          echo "## Corpus" >> "$GITHUB_STEP_SUMMARY"
          echo "- restored files: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Cold fuzzing start::No corpus was restored."
          fi

      - name: Generate headers
        run: make ARCH=x86_64 obj/include/bits/alltypes.h

      - name: Fuzz
        id: fuzz
        shell: bash
        env:
          SECONDS_PER: ${{ github.event.inputs.seconds || (github.event_name == 'push' && '20') || '300' }}
          HARNESSES: ${{ github.event.inputs.harnesses || '' }}
        run: |
          : > fuzz.log
          if [ -n "$HARNESSES" ]; then
            read -ra selected <<< "$HARNESSES"
            FUZZ_JOBS=$(nproc) tools/fuzz.sh "$SECONDS_PER" "${selected[@]}" 2>&1 | tee fuzz.log
          else
            FUZZ_JOBS=$(nproc) tools/fuzz.sh "$SECONDS_PER" 2>&1 | tee fuzz.log
          fi

      - name: Summarize
        id: summary
        if: always()
        shell: bash
        run: |
          touch fuzz.log
          {
            echo '## Fuzz run'
            grep -E '^   corpus [0-9]+ -> [0-9]+$' fuzz.log || echo '(no corpus counts reported)'
          } >> "$GITHUB_STEP_SUMMARY"
          found=$(grep -oE '^   fuzz_[a-z]+ FOUND SOMETHING' fuzz.log \
                  | awk '{print $1}' | sed 's/^fuzz_//' | sort -u | tr '\n' ' ' || true)
          echo "found=${found% }" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ github.run_id }}
          path: |
            fuzz.log
            obj/fuzzcorpus/*/crashes
          if-no-files-found: warn

      - name: Open or update finding issues
        if: ${{ failure() && steps.summary.outputs.found != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.summary.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for harness in $FOUND; do
            title="fuzz: fuzz_$harness found something"
            existing=$(gh issue list --state all --search "$title in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            body=$(printf '%s\n' \
              "\`tools/fuzz.sh\` reported a finding in \`fuzz_$harness\`." \
              "" "Run: $RUN_URL" "" \
              "Download the run artifact and replay its crashing input with:" \
              "\`tools/fuzz.sh --repro <absolute-path-to-input> $harness\`" \
              "" "Keep a durable reproducer in the matching test/*.c file.")
            if [ -n "$existing" ]; then
              gh issue reopen "$existing" 2>/dev/null || true
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --label fuzz 2>/dev/null \
                || gh issue create --title "$title" --body "$body"
            fi
          done

  # A second, independent engine over the same fuzz/fuzz_*.c harnesses
  # the job above drives with libFuzzer -- see tools/afl-fuzz.sh and the
  # ENGINE comment at the top of fuzz/Makefile for why a second engine
  # over one set of harnesses is worth having.  A separate job, not
  # separate steps in the job above: the two engines don't share a
  # build (ENGINE=afl vs the default), a corpus, or a cache key, and a
  # slow or wedged AFL++ run should not hold up the libFuzzer job's
  # results or vice versa.  Structured as closely as possible after the
  # `fuzz` job (corpus caching, summary format, issue-filing) so the two
  # stay easy to compare; the corpus, cache key and issue titles are
  # kept separate so a libFuzzer-only finding and an AFL++-only finding
  # never collide.
  afl-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install clang and afl++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang afl++

      - name: Restore and save corpus
        id: corpus_rw
        if: ${{ github.event_name != 'push' && github.event.inputs.reset_corpus != 'yes' }}
        uses: actions/cache@v6
        with:
          path: obj/aflcorpus
          key: afl-fuzz-corpus-${{ github.run_id }}
          restore-keys: afl-fuzz-corpus-

      - name: Restore corpus read-only
        id: corpus_ro
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/restore@v6
        with:
          path: obj/aflcorpus
          key: afl-fuzz-corpus-${{ github.run_id }}
          restore-keys: afl-fuzz-corpus-

      - name: Report corpus restore
        shell: bash
        run: |
          mkdir -p obj/aflcorpus
          matched='${{ steps.corpus_rw.outputs.cache-matched-key }}${{ steps.corpus_ro.outputs.cache-matched-key }}'
          count=$(find obj/aflcorpus -type f | wc -l)
          echo "corpus: $count file(s) restored from '${matched:-<none>}'"
          echo "## Corpus" >> "$GITHUB_STEP_SUMMARY"
          echo "- restored files: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Cold fuzzing start::No corpus was restored."
          fi

      - name: Generate headers
        run: make ARCH=x86_64 obj/include/bits/alltypes.h

      - name: Fuzz
        id: fuzz
        shell: bash
        env:
          SECONDS_PER: ${{ github.event.inputs.seconds || (github.event_name == 'push' && '20') || '300' }}
          HARNESSES: ${{ github.event.inputs.harnesses || '' }}
        run: |
          : > afl-fuzz.log
          if [ -n "$HARNESSES" ]; then
            read -ra selected <<< "$HARNESSES"
            FUZZ_JOBS=$(nproc) tools/afl-fuzz.sh "$SECONDS_PER" "${selected[@]}" 2>&1 | tee afl-fuzz.log
          else
            FUZZ_JOBS=$(nproc) tools/afl-fuzz.sh "$SECONDS_PER" 2>&1 | tee afl-fuzz.log
          fi

      - name: Summarize
        id: summary
        if: always()
        shell: bash
        run: |
          touch afl-fuzz.log
          {
            echo '## AFL++ fuzz run'
            grep -E '^   corpus [0-9]+ -> [0-9]+$' afl-fuzz.log || echo '(no corpus counts reported)'
          } >> "$GITHUB_STEP_SUMMARY"
          found=$(grep -oE '^   fuzz_[a-z]+ FOUND SOMETHING' afl-fuzz.log \
                  | awk '{print $1}' | sed 's/^fuzz_//' | sort -u | tr '\n' ' ' || true)
          echo "found=${found% }" >> "$GITHUB_OUTPUT"

      - name: Package crash artifacts
        if: always()
        shell: bash
        run: |
          # AFL++ names crash files like
          # `id:000000,sig:06,src:000123,time:12345,op:havoc,rep:4`, and
          # actions/upload-artifact@v7 rejects any path containing a colon
          # -- so uploading obj/aflcorpus/*/default/crashes directly makes
          # the "Upload artifacts" step below silently drop every crashing
          # input it finds (see #8: every reopen of that issue had no real
          # reproducer recoverable from the run artifact). Tar each
          # harness's crashes directory into one colon-free archive
          # instead; tar keeps the original names -- and anything else AFL
          # left alongside them, e.g. crashes/README.txt -- intact inside
          # the archive, where upload-artifact never has to look at them.
          mkdir -p obj/afl-crashes
          shopt -s nullglob
          for dir in obj/aflcorpus/*/default/crashes; do
            harness=$(basename "$(dirname "$(dirname "$dir")")")
            tar -czf "obj/afl-crashes/${harness}-crashes.tar.gz" -C "$dir" .
          done
          ls -la obj/afl-crashes 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afl-fuzz-${{ github.run_id }}
          path: |
            afl-fuzz.log
            obj/afl-crashes/*.tar.gz
          if-no-files-found: warn

      - name: Open or update finding issues
        if: ${{ failure() && steps.summary.outputs.found != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.summary.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for harness in $FOUND; do
            title="fuzz: fuzz_$harness found something (AFL++)"
            existing=$(gh issue list --state all --search "$title in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            body=$(printf '%s\n' \
              "\`tools/afl-fuzz.sh\` reported a finding in \`fuzz_$harness\`." \
              "" "Run: $RUN_URL" "" \
              "Download the run artifact, extract \`obj/afl-crashes/$harness-crashes.tar.gz\`" \
              "(crash filenames use AFL++'s own \`,\`-separated convention, e.g." \
              "\`id:000000,sig:06,...\`), and replay a crashing input with:" \
              "\`tools/afl-fuzz.sh --repro <absolute-path-to-input> $harness\`" \
              "" "Keep a durable reproducer in the matching test/*.c file.")
            if [ -n "$existing" ]; then
              gh issue reopen "$existing" 2>/dev/null || true
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --label fuzz 2>/dev/null \
                || gh issue create --title "$title" --body "$body"
            fi
          done
