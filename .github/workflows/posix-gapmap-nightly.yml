name: POSIX gap map (nightly)

# A separate workflow file rather than a `schedule:` trigger added to
# ci.yml, deliberately: `on: schedule` is a workflow-level trigger, so
# putting it there would run every job in CI nightly as a side effect of
# wanting one of them. That is a change to what CI means, made by
# accident, in a file whose job graph was just deliberately split.
#
# WHAT THIS ADDS OVER THE PER-PUSH CHECK, WHICH IS THE HONEST QUESTION
#
# ci.yml's `posix-gapmap` job already measures the pinned suite on every
# push.  The nightly adds upstream-drift visibility and keeps a downloadable
# snapshot without committing generated reports to the source tree.
#
# What it adds is the one thing a per-push job structurally cannot see:
# whether the PIN has drifted from upstream. New tests landing in LTP
# change what the gap map would say without changing anything in this
# repository, and nothing else in this project would ever notice.
#
# That drift is reported and never enforced. "How far behind upstream is
# acceptable" is exactly the unjustifiable threshold this report refuses
# to invent. The classification invariants remain hard failures.
on:
  schedule:
    # 04:17 UTC. Off the hour on purpose -- GitHub queues scheduled
    # workflows hardest at :00.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TINYCC_REPO: https://github.com/Pandapip1/tinycc.git
  TINYCC_SHA: 69eed4d346f31dea12d61b99f60298d2f59f66be

jobs:
  gapmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # submodules: true, deliberately NOT `recursive`, and
      # fetch-depth: 0. LTP carries four nested submodules of its own,
      # two of them on git.kernel.org, and the Open POSIX Test Suite
      # reads none of them. See the identically-shaped step in ci.yml.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Assert the OPTS suite actually arrived
        run: |
          d=third_party/ltp/testcases/open_posix_testsuite
          if [ ! -f "$d/include/posixtest.h" ]; then
            echo "FAILED: third_party/ltp is empty -- the suite this workflow exists to measure did not arrive." >&2
            git submodule status || true
            exit 1
          fi
          n=$(find "$d/conformance/interfaces" -name '*.c' | wc -l)
          echo "$n conformance test source file(s) present"
          if [ "$n" -eq 0 ]; then
            echo "FAILED: the suite holds no conformance tests; this run would measure nothing." >&2
            exit 1
          fi

      # A nightly may be the first run after the shared cache expires, so
      # it is allowed to rebuild the pinned toolchain on a miss.
      - name: Restore or build tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
          build-on-miss: "true"

      - name: Configure
        run: ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32

      - name: Build
        run: make -j"$(nproc)"

      # The same check ci.yml runs, for the same reason: the four
      # invariants are what make the numbers below mean anything, and a
      # nightly that reported a distribution without them would be the
      # number-nobody-reads failure this report is built to avoid.
      - name: Generate POSIX gap map
        run: make posix-gapmap

      # Informational only, and never a failure. See the header.
      - name: How far the LTP pin has drifted from upstream
        run: |
          cd third_party/ltp
          pin=$(git rev-parse HEAD)
          git remote add upstream https://github.com/linux-test-project/ltp.git 2>/dev/null || true
          git fetch --quiet upstream master
          behind=$(git rev-list --count "$pin..upstream/master")
          echo "pin:            $pin"
          echo "commits behind: $behind"
          d=testcases/open_posix_testsuite/conformance/interfaces
          here=$(find "$d" -name '*.c' | wc -l)
          there=$(git ls-tree -r --name-only upstream/master -- "$d" | grep -c '\.c$' || true)
          echo "conformance tests at the pin:      $here"
          echo "conformance tests at upstream tip: $there"
          if [ "$here" != "$there" ]; then
            echo "::notice::LTP upstream has $there conformance tests, the pin has $here."
            echo "::notice::Moving the pin will fire the census invariant; bump CENSUS_TESTS in the same commit."
          fi

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: posix-gap-map
          path: test/POSIX-GAP-MAP.generated.md
