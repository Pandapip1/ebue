name: CI

# Builds ntlibc and runs its test suite for both supported targets,
# i386-win32 and x86_64-win32, two ways:
#
#   - `test` (Linux + Wine): cross-builds with tinycc and runs the tests
#     under Wine. Fast, but Wine emulates ntdll/kernel32 rather than being
#     real Windows, so it can pass (or fail) differently than the real
#     thing -- notably it doesn't implement everything (see the Makefile's
#     TEST_RUN comment on the `*-win.c` tests it can't run at all).
#   - `windows-test` (real `windows-latest` runner): downloads the very
#     same test/*.exe the `build-test-exes` job compiled (including the
#     `*-win.c` ones Wine skips) and runs them directly on real Windows.
#     This is
#     the job that actually proves fork()/WOW64 behavior and any
#     kernel32 (Ctrl-C handler) code paths, rather than relying on Wine's
#     emulation of them. GitHub-hosted Windows runners are free and
#     unlimited for public repositories (this repo is public), so there's
#     no cost reason not to run this in addition to the Wine-based jobs.
#     No tcc/cross-toolchain is needed on that runner at all -- it never
#     compiles anything, it only executes the binaries the Linux job
#     already built.
#
# `test`'s matrix has three legs, not a full 2x2 of arch x kernel32: both
# arches at the default `--disable-kernel32` (the configuration the
# project actually recommends, per CONTRIBUTING.md's "NTDLL first,
# kernel32 only as a last resort" -- that has to stay the best-covered
# build, not lose coverage to the guarded one), plus one extra x86_64 leg
# at `--enable-kernel32` so the code behind every `#ifdef
# NTLIBC_USE_KERNEL32` (currently src/signal/signal.c's console
# Ctrl-C/Ctrl-Break handler, installed via kernel32's
# SetConsoleCtrlHandler) actually gets compiled, run under Wine, and then
# re-run on real Windows by `windows-test` below. A full 2x2 would double
# the job instead of adding one leg to it; kernel32 support itself isn't
# arch-specific -- it's a single kernel32 call reached the same way on
# both targets -- so one arch is enough to exercise it, the same
# reasoning the "Regenerate generated files" step below already uses to
# run on only one leg.
#
# The only non-standard piece of the build itself is the compiler: ntlibc
# is built with a win32-cross-targeting tinycc (upstream tinycc's own
# `./configure --enable-cross` produces both the i386-win32-tcc and
# x86_64-win32-tcc binaries used below, alongside the native/other cross
# targets we don't need here). That's a completely ordinary,
# from-scratch-buildable-in-CI toolchain -- nothing like the kaem/mescc-tools
# bootstrap path under boot/kaem/, which is unrelated to CI and is not
# exercised here except for the drift check in the "Regenerate generated
# files" step below.

on:
  push:
  pull_request:

permissions:
  contents: read

# No `concurrency:` block on purpose. Every run is allowed to finish.
#
# Superseding a run is only ever right where a later commit makes an
# earlier one uninteresting. That is never true here: every commit pushed
# to main is a state of the tree somebody may bisect to, and a cancelled
# run reports as a *failure* -- so cancelling does not merely lose the
# answer, it records a red one that was never earned and leaves the
# history lying about which commits were tested.
#
# What gets lost is the signal nothing else provides. The `windows-test`
# legs on a real Windows runner are this project's only oracle for real-NT
# behaviour -- Wine emulates ntdll/kernel32 and has both passed things real
# Windows fails and failed things it passes, so several bugs were visible
# only there. Throwing away that verdict to save runner time is the wrong
# trade, and the runners are free on a public repo anyway; the cost of
# overlapping runs is queue latency, not money.

env:
  # Pinned to a specific upstream tinycc commit (rather than always
  # building tinycc's HEAD) so this workflow's toolchain -- and therefore
  # ntlibc's own build/test results -- stay reproducible across CI runs
  # and don't shift underneath us if tinycc lands a regression or a
  # behavior change. Bump this deliberately (and re-validate ntlibc
  # against the new commit) rather than tracking upstream automatically.
  # Pandapip1/tinycc, branch ntlibc-toolchain: upstream mob (2ba12e83) plus
  # two things ntlibc needs. An inline-asm operand fix ("=m"/"m" on an array
  # struct member reached through a pointer, which src/math/fenv.c hits), and
  # -Wl,--delay-all, which test/delayall.c requires -- configure probes for
  # it and skips that test where it is missing, so an upstream toolchain
  # still builds everything else. Pinned by SHA, not by branch name, so a
  # push to the fork cannot silently change what CI compiles with.
  TINYCC_REPO: https://github.com/Pandapip1/tinycc.git
  TINYCC_SHA: 69eed4d346f31dea12d61b99f60298d2f59f66be

jobs:
  reuse:
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 10
    steps:
      # Deliberately WITHOUT `submodules:`. third_party/libc-test is a
      # submodule, and its ~940 files are not this repository's files for
      # REUSE purposes -- they belong to musl's libc-test, which ships its
      # own COPYRIGHT, and their licences are not uniform (src/math/ucb
      # and src/math/crlibm are BSD and GPL, not MIT). Checking them out
      # here would make this job lint another project's tree and demand
      # SPDX headers we have no right to add. The local `reuse` tool skips
      # submodules on its own when .git is present, so leaving them out
      # here is what keeps the two in agreement; tools/gate.sh's reuse
      # stage excludes third_party/ from its tree copy for the same
      # reason. See third_party/README.md.
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  # Build the win32-cross tinycc toolchain once and cache it, keyed on the
  # pinned commit above, so a normal CI run restores a prebuilt toolchain
  # instead of rebuilding a whole cross-compiler from scratch every time.
  build-toolchain:
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 30
    steps:
      - name: Cache tinycc toolchain
        id: cache-tinycc
        uses: actions/cache@v6
        with:
          path: ~/tinycc-install
          key: tinycc-${{ env.TINYCC_SHA }}-${{ runner.os }}-v1

      - name: Clone tinycc
        if: steps.cache-tinycc.outputs.cache-hit != 'true'
        run: |
          git clone "$TINYCC_REPO" tinycc
          git -C tinycc checkout "$TINYCC_SHA"

      - name: Build and install tinycc (--enable-cross)
        if: steps.cache-tinycc.outputs.cache-hit != 'true'
        run: |
          cd tinycc
          ./configure --enable-cross --prefix="$HOME/tinycc-install"
          make -j"$(nproc)"
          make install

      - name: Sanity-check the cross compilers exist
        run: |
          test -x "$HOME/tinycc-install/bin/i386-win32-tcc"
          test -x "$HOME/tinycc-install/bin/x86_64-win32-tcc"

  # Compile the test PEs and publish them, without running anything.
  #
  # This job exists purely to get `windows-test` off the critical path of
  # the Wine run, and it is not a redundant build -- please don't fold it
  # back into `test`. The real-Windows legs consume exactly one thing from
  # the Linux side: the `test-exes-*` artifact. Those .exe files are
  # finished the moment they are *compiled*; nothing the Wine run does
  # afterwards changes a byte of them. While the upload lived at the end
  # of `test`, the real-Windows legs waited for the whole leg anyway --
  # measured on a real run, ~62s installing Wine (which they never use)
  # plus a ~75s `make check` that is almost entirely Wine process startup,
  # so roughly 140s of waiting for artefacts that were ready in the first
  # second of it. The cross-compile itself is well under a second with
  # tcc, so this job is essentially runner startup, a cache restore and an
  # upload.
  #
  # Deliberately no Wine here: installing it is the single largest step in
  # the old serial path and this job has nothing to run.
  #
  # Only `windows-test` depends on this job. The Wine leg below runs
  # alongside it and builds its own tree -- see the comment on `test`.
  #
  # The matrix mirrors `test`'s three legs exactly, because the artifact
  # names (`test-exes-${{ matrix.name }}`) are what `windows-test`
  # indexes by -- see the comment on `test`'s matrix for why there are
  # three legs and not a full 2x2.
  build-test-exes:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            host: i386-win32
            cc: i386-win32-tcc
            kernel32: false
            name: i386
          - arch: x86_64
            host: x86_64-win32
            cc: x86_64-win32-tcc
            kernel32: false
            name: x86_64
          - arch: x86_64
            host: x86_64-win32
            cc: x86_64-win32-tcc
            kernel32: true
            name: x86_64-kernel32
    steps:
      - uses: actions/checkout@v7

      - name: Restore tinycc toolchain
        uses: actions/cache@v6
        with:
          path: ~/tinycc-install
          key: tinycc-${{ env.TINYCC_SHA }}-${{ runner.os }}-v1

      - name: Add tinycc to PATH
        run: echo "$HOME/tinycc-install/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} \
            --${{ matrix.kernel32 && 'enable' || 'disable' }}-kernel32

      # `test-exes` (Makefile) is `check` without the runtests.sh line:
      # it builds every test PE -- including the *-win.c ones Wine cannot
      # run, and the plugin DLLs that are prerequisites of the tests that
      # load them -- and runs none of them.
      - name: Build the test binaries
        run: make -j"$(nproc)" test-exes

      # Publish the built PE test binaries (everything under obj/test/,
      # which includes the *-win.c ones the `test` job's `check` step
      # deliberately doesn't run under Wine -- see the Makefile's
      # TEST_RUN comment) so the windows-test job below can execute them
      # on a real Windows runner. Named per matrix leg (not just per arch)
      # because x86_64 produces two builds -- a kernel32-enabled test
      # binary and a kernel32-disabled one behave differently (only the
      # former installs a Ctrl-C handler), so they can't share a name.
      - name: Upload test binaries
        uses: actions/upload-artifact@v7
        with:
          name: test-exes-${{ matrix.name }}
          # The .dll matters: test/rpath.c delay-loads obj/test/rpath-plugin.dll
          # from its own directory ($ORIGIN). Uploading only *.exe left the
          # plugin behind, so on the real-Windows runner the search correctly
          # found nothing and the helper aborted -- a red leg caused by a
          # missing artefact, not by the code under test.
          path: |
            obj/test/*.exe
            obj/test/*.dll
          # Guards against a silently empty upload: an empty artifact would
          # make windows-test's PowerShell loop iterate zero times and exit
          # 0 -- a green job that tested nothing.
          if-no-files-found: error

  # The Wine leg. A *sibling* of build-test-exes, not a consumer of it --
  # deliberately, and please don't "tidy" the two into a chain. The
  # obvious-looking simplification is to have both legs share
  # build-test-exes as their one dependency, but the two consumers want
  # different things: `windows-test` wants only the artifact, while this
  # job wants a configured tree it builds itself, in under a second.
  # Gating it on build-test-exes would therefore buy it nothing and cost
  # it that job's entire startup latency -- runner allocation, checkout,
  # cache restore, ~25-30s it does not pay today -- to wait on a job whose
  # real work is sub-second. Kept as siblings, total wall clock is
  # max(this leg, build-test-exes + windows-test) instead of a serial
  # 25-30s added to both.
  #
  # Rebuilds rather than downloading the artifact above for the same
  # reason: `make check` needs a configured tree with lib/libc.a present
  # anyway (every test .exe lists it as a prerequisite), and the
  # cross-compile is under a second with tcc against a restored toolchain
  # cache -- so downloading would save nothing measurable and would add a
  # dependence on artefact timestamps to keep make from rebuilding them.
  test:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            host: i386-win32
            cc: i386-win32-tcc
            kernel32: false
            name: i386
          - arch: x86_64
            host: x86_64-win32
            cc: x86_64-win32-tcc
            kernel32: false
            name: x86_64
          - arch: x86_64
            host: x86_64-win32
            cc: x86_64-win32-tcc
            kernel32: true
            name: x86_64-kernel32
    steps:
      # submodules: recursive -- the "libc-test corpus" step below needs
      # third_party/libc-test, which is a submodule. Without this the
      # directory is empty and tools/libc-test.sh exits 2 by design
      # rather than skipping, so this is load-bearing rather than
      # decorative. See third_party/README.md.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore tinycc toolchain
        uses: actions/cache@v6
        with:
          path: ~/tinycc-install
          key: tinycc-${{ env.TINYCC_SHA }}-${{ runner.os }}-v1

      - name: Add tinycc to PATH
        run: echo "$HOME/tinycc-install/bin" >> "$GITHUB_PATH"

      # Package set needed for `make check` to actually run the PE test
      # binaries under Wine (both the 32- and 64-bit loaders are needed
      # regardless of which ntlibc arch is under test).
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32:i386 wine64

      - name: Configure
        run: |
          ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} \
            --${{ matrix.kernel32 && 'enable' || 'disable' }}-kernel32

      - name: Build
        run: make -j"$(nproc)"

      - name: Check
        run: make -j"$(nproc)" check

      # musl's libc-test corpus, adjudicated against
      # test/libc-test-expected.txt. Pinned to one leg for the same reason
      # tools/gate.sh runs it on x86_64 only: the corpus is
      # arch-independent C, so a second arch doubles the ledger's
      # maintenance for no new evidence.
      #
      # This runs against the stock apt Wine installed above, which
      # predates RtlCloneUserProcess -- so the tests that fork report
      # rc=77 (UNVERIFIED) here rather than a verdict. That is detected
      # from each test's own output at run time, never from a static
      # list, precisely so the number is visible and moves on its own
      # when Wine gains the call. See tools/libc-test.sh's header.
      - name: libc-test corpus
        if: matrix.name == 'x86_64'
        run: make libc-test

      # Only needs to run once, not once per matrix leg (both generators
      # cover every arch themselves): catches either kind of generated-and-
      # committed file drifting out of sync with its source -- the expanded
      # bits/*.h.gen headers vs. their *.h.in DSL sources, and
      # boot/kaem/build-$(ARCH).kaem vs. the real Makefile build recipe as
      # source files are added/removed/renamed. See CONTRIBUTING.md's "kaem
      # bootstrap build path" section, and .githooks/pre-commit, which runs
      # the same two checks locally.
      #
      # Deliberately pinned to the kernel32-disabled x86_64 leg, not just
      # "x86_64": KERNEL32 feeds CFLAGS_ALL (Makefile), so gen-kaem.sh's
      # dry-run bakes -DNTLIBC_USE_KERNEL32 into every compile line of
      # boot/kaem/build-*.kaem when it's run against a tree configured
      # with --enable-kernel32 -- confirmed locally: every recipe line
      # differs. The committed kaem scripts have to reflect one
      # configuration consistently rather than whichever leg happened to
      # regenerate them last, and it has to be --disable-kernel32: the
      # kaem/mescc-tools bootstrap path is pure-ntdll by nature (it is
      # building the compiler itself, long before kernel32 is even a
      # concept there's a use for), matching this project's own default.
      - name: Regenerate generated files and check for drift
        if: matrix.name == 'x86_64'
        run: |
          make generated
          git diff --exit-code -- 'arch/*/bits/*.h.gen' 'include/*.h.gen'
          git diff --exit-code -- boot/kaem/

  # Runs the exact same PE binaries `build-test-exes` compiled and that
  # the `test` job (for the non-*-win.c ones) runs under Wine -- the two
  # legs consume the same artifact and run concurrently, so this one does
  # not wait on the Wine verdict. This time on a real
  # Windows machine. windows-latest is an x86_64 host; a plain i386 PE
  # .exe runs on it transparently through WOW64 with no special setup --
  # WOW64 is Windows' built-in compatibility layer specifically for
  # running unmodified 32-bit x86 binaries on 64-bit Windows (see
  # Microsoft's "WOW64 Implementation Details":
  # https://learn.microsoft.com/en-us/windows/win32/winprog64/wow64-implementation-details).
  windows-test:
    needs: build-test-exes
    runs-on: windows-latest
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Mirrors the `build-test-exes` legs exactly (by artifact name, not
      # just by arch) so a kernel32-enabled build gets proven against real
      # Windows too, rather than only ever running under Wine's emulation
      # of kernel32 -- Wine doesn't implement everything ntlibc might call
      # (see the TEST_RUN comment in the Makefile), so this is the leg
      # that actually matters for the Ctrl-C handler path.
      matrix:
        name: [i386, x86_64, x86_64-kernel32]
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-exes-${{ matrix.name }}
          path: test-exes

      - name: Run test binaries on real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          $unverified = 0
          $ran = 0
          Get-ChildItem -Path test-exes -Filter *.exe | Sort-Object Name | ForEach-Object {
            $ran += 1
            Write-Host "Running $($_.Name)"
            & $_.FullName
            $rc = $LASTEXITCODE
            if ($rc -eq 0) {
              Write-Host "PASS $($_.Name)"
            } elseif ($rc -eq 77) {
              # Same third outcome tools/runtests.sh and tools/asan-build.sh
              # already recognise: the binary ran and nothing it could check
              # failed, but some assertion group could not be verified in this
              # environment (it printed SKIP lines saying which). Distinct from
              # a pass, and deliberately not a failure.
              Write-Host "UNVERIFIED $($_.Name) (rc=77)"
              $unverified += 1
            } else {
              Write-Host "FAIL $($_.Name) (rc=$rc)"
              $failed = $true
            }
          }
          # A floor, for the same reason tools/runtests.sh and
          # tools/asan-build.sh have one: $failed can only become true
          # inside the loop body, so an empty test-exes/ directory runs
          # the body zero times, leaves $failed false, and exits 0 --
          # this leg reporting green having executed nothing.  That is
          # not hypothetical for a download step: a rename of the
          # artifact, an upload that produced a differently-shaped
          # directory, or a matrix leg whose artifact does not exist all
          # end here.  The upload side is already guarded
          # (if-no-files-found: error in build-test-exes); this is the
          # download-and-run side, and it is the leg that caught the
          # METHOD_BUFFERED IOCTL_AFD_SELECT bug, which no other leg
          # could see.
          Write-Host "$ran test binary/binaries ran"
          if ($ran -eq 0) {
            Write-Host "FAILED: no test binaries were found under test-exes/; this job verified nothing"
            exit 1
          }
          if ($unverified -gt 0) {
            Write-Host "$unverified test binary/binaries reported unverified (rc=77)"
          }
          if ($failed) {
            Write-Host "One or more test binaries failed"
            exit 1
          }

  # Static checking that tcc does not do: gcc and clang strict-warning
  # builds of the whole library for both arches, plus the clang static
  # analyzer, cppcheck and shellcheck where installed. Strict on purpose
  # -- `make lint` exits non-zero on any finding and nothing here is
  # relaxed to keep the job green. It is expected to be RED until the
  # open findings are worked off; a check that lies about the state of
  # the tree is worse than one that is honestly failing.
  #
  # Independent of the tcc jobs: it never builds with tcc, so no `needs:`.
  # One job per lint stage rather than one job running all five. Three
  # reasons: a red board names the stage that failed instead of just
  # "lint", so the logs are only needed for the detail; the stages are
  # independent and now run in parallel, so wall-clock is the slowest
  # stage (cppcheck, ~70s) rather than their sum (~140s); and each job
  # installs only the tools it needs instead of every linter for every
  # stage.
  #
  # fail-fast is off deliberately: one stage failing should not hide the
  # state of the other four, which is exactly what made the last few
  # lint failures take several rounds to work through.
  lint:
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc and clang strict-warning builds, both arches.
          - stage: warn
            packages: clang gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          # clang-tidy, pinned: newer LLVM adds checks under the
          # bugprone-*/cert-*/misc-*/clang-analyzer-* families this project
          # enables, so an unpinned install makes the finding count -- and
          # so whether this is green -- depend on which Ubuntu image is
          # current rather than on the code.
          - stage: analyze
            packages: clang clang-tidy-18
          - stage: cppcheck
            packages: cppcheck
          - stage: shell
            packages: shellcheck
          # Checks every function declared in include/ is defined
          # somewhere; needs no tool beyond a shell.
          - stage: undefined
            packages: ""
          # Unguarded (USHORT) narrowing casts -- the UNICODE_STRING.Length
          # wrap class tools/lint-ushort.sh was written for.  Text-only,
          # needs no tool beyond a shell, and takes half a second; it was
          # simply never listed here, so the detector written to stop that
          # bug recurring had never run in CI at all.
          - stage: ushort
            packages: ""
          # Functions this library implements that no test/*.c even
          # references.  Compiles every test/*.c natively and reads the
          # undefined symbols, so it needs a native clang and nm (both
          # already on ubuntu-24.04; clang is installed explicitly for
          # the same reason the warn stage installs it).
          - stage: unreferenced
            packages: clang
    name: lint (${{ matrix.stage }})
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools this stage needs
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      # tools/lint.sh reads neither config.mak nor ARCH: it derives the
      # arch list from arch/*/ and builds its own alltypes.h, so no
      # ./configure and no cross toolchain are needed here.
      # LINT_TIDY_EXACT=1 applies only to the analyze stage (the other
      # stages ignore it): the point of pinning clang-tidy-18 here is
      # that this job runs one known analysis, and .clang-tidy selects
      # checks by wildcard, so without an equality assertion against
      # tools/clang-tidy-checks.txt an image bump silently changes what
      # "0 findings" means.  A tool offering more is drift the pin exists
      # to prevent; a tool offering fewer is a weaker analysis reporting
      # the same green.
      - name: tools/lint.sh ${{ matrix.stage }}
        env:
          CLANG_TIDY: clang-tidy-18
          LINT_TIDY_EXACT: "1"
        run: tools/lint.sh ${{ matrix.stage }}

      # Each stage writes its findings to obj/lint/*.log and prints only a
      # count, so without these a red job says "1 finding" without saying
      # which. Tool versions differ between here and a developer's machine
      # -- every lint failure so far has been exactly that -- so these logs
      # are often the only way to see what CI saw.
      - name: Upload the ${{ matrix.stage }} logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs-${{ matrix.stage }}
          path: obj/lint/
          if-no-files-found: warn

  # A second, native (Linux/ELF) build of the same src/*.c under
  # AddressSanitizer and UBSan, running the test/*.c that do not need
  # ntdll. This catches memory errors and undefined behaviour that the
  # tcc/Wine build cannot see at all -- the LLONG_MIN negations in
  # printf.c and scanf.c were both found this way, and both pass `make
  # check` under tcc, which happens to emit the wrapping instruction.
  #
  # Also expected to be RED for now. Not relaxed.
  asan:
    runs-on: ubuntu-24.04
    # A hung job otherwise occupies a runner until GitHub's 360-minute
    # default. There is deliberately no `concurrency:` block (see above),
    # so nothing cancels it either -- a test that hangs rather than fails
    # blocked main for 25 minutes before being cancelled by hand.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # $(GENH) is a concatenation of committed .h.gen files, so this
      # needs no compiler -- only ARCH, which make takes on the command
      # line. asan builds everything else natively with clang.
      - name: make asan
        run: make ARCH=x86_64 asan

      - name: Upload the failing test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asan-output
          path: obj/asan/test/*.out
          if-no-files-found: warn
