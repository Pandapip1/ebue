name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Do not cancel superseded runs: each commit on main remains useful bisect
# evidence, and the real-Windows jobs are the only oracle for native NT.
env:
  TINYCC_REPO: https://github.com/Pandapip1/tinycc.git
  TINYCC_SHA: 69eed4d346f31dea12d61b99f60298d2f59f66be
  # Our patched Wine fork: implements RtlCloneUserProcess (fork()) and
  # related clone work that stock apt Wine lacks entirely. Pinned to a
  # commit, not a branch, so a fork update is a deliberate bump here
  # rather than a silent runtime change underneath every Wine-consuming
  # job. See .github/actions/setup-wine and the build-wine job below.
  WINE_REPO: https://github.com/Pandapip1/wine.git
  WINE_SHA: 52fef96f6

jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Submodules are separate projects with their own licensing metadata.
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  # The minimum supported Windows version, checked against the import list
  # that decides it (tools/lint-minver.sh). Its own job, and the cheapest
  # one here: it reads README.md and tools/ntdll.def out of the checkout,
  # builds nothing, and needs neither the cross toolchain nor Wine.
  #
  # It is in CI, and not only in tools/gate.sh, because it guards the one
  # claim no other job in this file can test. `ntlibc-suite` runs under
  # Wine, whose ntdll has no version gates at all and resolves every
  # import regardless of vintage; `windows-test` runs on Server 2025,
  # which is many releases past the floor. Both are green on an image
  # that older Windows would refuse to load outright -- which is exactly
  # how the Windows 7 floor went unrecorded for as long as it did.
  minver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No `submodules:` -- this reads two files from this repository and
      # nothing else.
      - uses: actions/checkout@v7
      - name: Minimum supported Windows version
        run: ./tools/lint-minver.sh

  # Build the win32-cross tinycc toolchain once and cache it, keyed on the
  # pinned commit above, so a normal CI run restores a prebuilt toolchain
  # instead of rebuilding a whole cross-compiler from scratch every time.
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
          build-on-miss: "true"

  # Build our patched Wine fork once and cache it, keyed on the pinned
  # commit above, exactly like build-toolchain does for tinycc. A Wine
  # build takes tens of minutes; every job that needs Wine below restores
  # this cache instead of rebuilding it, and does so with build-on-miss
  # left at its default "false" -- a miss there means this job and that
  # pin disagreed, which should fail loudly rather than rebuild silently
  # (and slowly, once per matrix leg) inside a downstream job.
  build-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build patched Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
          build-on-miss: "true"

  # This produces the exact PE files consumed on real Windows.  Wine jobs
  # rebuild independently so they can run in parallel with this hand-off.
  build-test-exes:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32 }
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build test binaries
        run: make -j"$(nproc)" test-exes
      - name: Upload test binaries
        uses: actions/upload-artifact@v7
        with:
          name: test-exes-${{ matrix.name }}
          # Keep obj/{test,sh}; sh-main.exe walks this layout to its fixture.
          path: |
            obj/test/*.exe
            obj/test/*.dll
            obj/sh/sh.exe
          if-no-files-found: error

  ntlibc-suite:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32 }
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build and check
        run: >-
          make -j"$(nproc)" ${{ matrix.name == 'x86_64' && 'check-pedantic' || 'check' }}
          TEST_PROFILE="capability.symlink=no capability.console=no"
      - name: Check generated files
        if: matrix.name == 'x86_64'
        run: |
          make generated
          git diff --exit-code -- 'arch/*/bits/*.h.gen' 'include/*.h.gen'
          git diff --exit-code -- boot/kaem/

  libc-test:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Run libc-test corpus
        run: make libc-test-pedantic

  posix-optsrun:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Check runner invariants
        run: ./tools/posix-opts.py selftest
      - name: Run buildable Open POSIX Test Suite cases
        run: make posix-optsrun-pedantic

  windows-test:
    needs: build-test-exes
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i386, arch: i386, kernel32: no }
          - { name: x86_64, arch: x86_64, kernel32: no }
          - { name: x86_64-kernel32, arch: x86_64, kernel32: yes }
    steps:
      - uses: actions/checkout@v7
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-exes-${{ matrix.name }}
          path: test-exes
      - name: Report Windows version
        shell: pwsh
        run: |
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          Write-Host "harness: leg=${{ matrix.name }} build=$($cv.CurrentBuild) UBR=$($cv.UBR) display=$($cv.DisplayVersion)"
      - name: Run test binaries on real Windows
        shell: pwsh
        run: >-
          python tools/run-tests.py --artifact-root test-exes
          --profile runtime=windows --profile target_arch=${{ matrix.arch }}
          --profile kernel32=${{ matrix.kernel32 }}

  # linkcheck and hygiene were local-gate-only for their whole life, so a
  # push could go red on `tools/gate.sh` and green here.  Both need the
  # real $(CC) rather than a host compiler -- linkcheck's whole point is a
  # genuine per-arch PE link, which is how `#define alloca __builtin_alloca`
  # once shipped past every host-toolchain lint -- so they need the pinned
  # tinycc, but neither needs Wine: nothing is executed.
  linkcheck:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc }
          - { host: x86_64-win32, cc: x86_64-win32-tcc }
    name: linkcheck (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --disable-kernel32
      - name: Link every declared symbol
        run: make -j"$(nproc)" linkcheck

  # hdr-hygiene.sh sweeps both arches itself; the $(GENH) prerequisite just
  # needs *a* configured arch to exist.
  hygiene:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Configure
        run: ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
      - name: Compile every public header in isolation
        run: make hygiene

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: warn, packages: "clang gcc-mingw-w64-i686 gcc-mingw-w64-x86-64" }
          - { stage: analyze, packages: "clang clang-tidy-18" }
          - { stage: cppcheck, packages: cppcheck }
          - { stage: shell, packages: shellcheck }
          - { stage: sizearith, packages: "" }
          - { stage: undefined, packages: "" }
          - { stage: unreferenced, packages: clang }
          - { stage: widthmod, packages: "" }
    name: lint (${{ matrix.stage }})
    steps:
      - uses: actions/checkout@v7
      - name: Install stage tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Run lint stage
        env:
          CLANG_TIDY: clang-tidy-18
          LINT_TIDY_EXACT: "1"
        run: tools/lint.sh ${{ matrix.stage }}
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs-${{ matrix.stage }}
          path: obj/lint/
          if-no-files-found: warn

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Run AddressSanitizer and UBSan suite
        # capability.overcommit=yes, explicitly.  The Makefile's
        # TEST_PROFILE default declares `no`, because the machine this
        # project is developed on has vm.overcommit_memory=2 and no
        # ASan-linked binary can start there (tools/asan-available.sh).
        # These runners have the default overcommit setting, so ASan runs
        # for real here -- and THIS JOB IS THE ONLY PLACE IT DOES, which
        # makes it the sole authority for heap-overflow, use-after-free,
        # double-free and leak findings.  Saying it here rather than
        # relying on asan-available.sh's stale-declaration veto is the
        # difference between a stated intent and a lucky one.
        env:
          TEST_PROFILE: capability.overcommit=yes
        run: make ARCH=x86_64 asan
      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asan-output
          path: obj/asan/test/*.out
          if-no-files-found: warn
