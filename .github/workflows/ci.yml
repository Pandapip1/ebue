name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Do not cancel superseded runs: each commit on main remains useful bisect
# evidence, and the real-Windows jobs are the only oracle for native NT.
env:
  TINYCC_REPO: https://github.com/Pandapip1/tinycc.git
  TINYCC_SHA: 69eed4d346f31dea12d61b99f60298d2f59f66be
  # Our patched Wine fork: implements RtlCloneUserProcess (fork()) and
  # related clone work that stock apt Wine lacks entirely. Pinned to a
  # commit, not a branch, so a fork update is a deliberate bump here
  # rather than a silent runtime change underneath every Wine-consuming
  # job. See .github/actions/setup-wine and the build-wine job below.
  WINE_REPO: https://github.com/Pandapip1/wine.git
  WINE_SHA: 52fef96f6

jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Submodules are separate projects with their own licensing metadata.
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  # The minimum supported Windows version, checked against the import list
  # that decides it (tools/lint-minver.sh). Its own job, and the cheapest
  # one here: it reads README.md and tools/ntdll.def out of the checkout,
  # builds nothing, and needs neither the cross toolchain nor Wine.
  #
  # It is in CI, and not only in tools/gate.sh, because it guards the one
  # claim no other job in this file can test. `ntlibc-suite` runs under
  # Wine, whose ntdll has no version gates at all and resolves every
  # import regardless of vintage; `windows-test` runs on Server 2025,
  # which is many releases past the floor. Both are green on an image
  # that older Windows would refuse to load outright -- which is exactly
  # how the Windows 7 floor went unrecorded for as long as it did.
  minver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No `submodules:` -- this reads two files from this repository and
      # nothing else.
      - uses: actions/checkout@v7
      - name: Minimum supported Windows version
        run: ./tools/lint-minver.sh

  # Build the win32-cross tinycc toolchain once and cache it, keyed on the
  # pinned commit above, so a normal CI run restores a prebuilt toolchain
  # instead of rebuilding a whole cross-compiler from scratch every time.
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
          build-on-miss: "true"

  # Build our patched Wine fork once and cache it, keyed on the pinned
  # commit above, exactly like build-toolchain does for tinycc. A Wine
  # build takes tens of minutes; every job that needs Wine below restores
  # this cache instead of rebuilding it, and does so with build-on-miss
  # left at its default "false" -- a miss there means this job and that
  # pin disagreed, which should fail loudly rather than rebuild silently
  # (and slowly, once per matrix leg) inside a downstream job.
  build-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build patched Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
          build-on-miss: "true"

  # Linux is complete on aarch64; x86_64 and i386 currently have curated
  # CRT build/run coverage, plus the ELF-loader subset on x86_64.  Keep each
  # architecture visible as its own matrix leg even though the x86 legs run
  # under qemu on the arm64 host.
  linux-builds:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, i386]
    name: Linux build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-user
      - name: Configure
        if: matrix.arch == 'aarch64'
        run: >-
          ./configure --platform=linux CC=clang
          CFLAGS="-fno-stack-protector -mno-outline-atomics"
      - name: Build library and CRT
        if: matrix.arch == 'aarch64'
        run: make -j"$(nproc)"
      - name: Run native Linux build suites
        if: matrix.arch == 'aarch64'
        env:
          NTLIBC_ARCH: aarch64
        run: |
          for script in tools/linux-build*.sh; do
            case "$script" in
              *-cross.sh) continue ;;
            esac
            "$script"
          done
      - name: Build and run cross-architecture CRT
        if: matrix.arch != 'aarch64'
        run: tools/linux-build-crt-cross.sh ${{ matrix.arch }}
      - name: Build and run x86_64 ELF loader
        if: matrix.arch == 'x86_64'
        run: tools/linux-build-dlfcn-cross.sh x86_64

  # Every row produces the exact PE files consumed by its matching native
  # Windows runner below, including arm64 rather than treating that row as a
  # compile-only archive check.
  build-test-exes:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386, target: test-exes, upload: true }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64, target: test-exes, upload: true }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32, target: test-exes, upload: true }
          - { host: arm64-win32, cc: arm64-win32-tcc, kernel32: disable, name: arm64, target: test-exes, upload: true }
    name: Windows build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build ${{ matrix.name }} artifacts
        run: make -j"$(nproc)" ${{ matrix.target }}
      - name: Upload test binaries
        if: matrix.upload
        uses: actions/upload-artifact@v7
        with:
          name: test-exes-${{ matrix.name }}
          # Keep obj/{test,sh}; sh-main.exe walks this layout to its fixture.
          path: |
            obj/test/*.exe
            obj/test/*.dll
            obj/sh/sh.exe
          if-no-files-found: error

  ntlibc-suite:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32 }
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build and check
        run: >-
          make -j"$(nproc)" ${{ matrix.name == 'x86_64' && 'check-pedantic' || 'check' }}
          TEST_PROFILE="capability.symlink=no capability.console=no"
      - name: Check generated files
        if: matrix.name == 'x86_64'
        run: |
          make generated
          git diff --exit-code -- 'arch/*/bits/*.h.gen' 'include/*.h.gen'
          git diff --exit-code -- boot/kaem/

  libc-test:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Run libc-test corpus
        run: make libc-test-pedantic

  posix-optsrun:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
        with:
          repository: ${{ env.WINE_REPO }}
          revision: ${{ env.WINE_SHA }}
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Check runner invariants
        run: ./tools/posix-opts.py selftest
      - name: Run buildable Open POSIX Test Suite cases
        run: make posix-optsrun-pedantic

  windows-test:
    needs: build-test-exes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i386, arch: i386, kernel32: no, runner: windows-latest }
          - { name: x86_64, arch: x86_64, kernel32: no, runner: windows-latest }
          - { name: x86_64-kernel32, arch: x86_64, kernel32: yes, runner: windows-latest }
          - { name: arm64, arch: aarch64, kernel32: no, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-exes-${{ matrix.name }}
          path: test-exes
      - name: Report Windows version
        shell: pwsh
        run: |
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          Write-Host "harness: leg=${{ matrix.name }} build=$($cv.CurrentBuild) UBR=$($cv.UBR) display=$($cv.DisplayVersion)"
      - name: Run test binaries on real Windows
        shell: pwsh
        run: >-
          python tools/run-tests.py --artifact-root test-exes
          --profile runtime=windows --profile target_arch=${{ matrix.arch }}
          --profile kernel32=${{ matrix.kernel32 }}

  # linkcheck and hygiene were local-gate-only for their whole life, so a
  # push could go red on `tools/gate.sh` and green here.  Both need the
  # real $(CC) rather than a host compiler -- linkcheck's whole point is a
  # genuine per-arch PE link, which is how `#define alloca __builtin_alloca`
  # once shipped past every host-toolchain lint -- so they need the pinned
  # tinycc, but neither needs Wine: nothing is executed.
  linkcheck:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc }
          - { host: x86_64-win32, cc: x86_64-win32-tcc }
    name: linkcheck (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      # The declared-symbol scanner (tools/clang/DeclScanner.cpp) is a real
      # clang AST walk, built as a clang plugin the same way tools/lint.sh
      # builds its own -- see that script's `lint` job matrix below for the
      # identical package list.
      - name: Install declaration-scanner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev llvm-18-dev
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --disable-kernel32
      - name: Link every declared symbol
        run: make -j"$(nproc)" linkcheck

  # hdr-hygiene.sh sweeps both arches itself; the $(GENH) prerequisite just
  # needs *a* configured arch to exist.
  hygiene:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
        with:
          repository: ${{ env.TINYCC_REPO }}
          revision: ${{ env.TINYCC_SHA }}
      - name: Configure
        run: ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
      - name: Compile every public header in isolation
        run: make hygiene

  lint:
    runs-on: ubuntu-24.04
    # ownership is Z3-bottlenecked path-sensitive analysis over every source
    # file, three checker passes each: real runs on this runner class take
    # ~23-25 real minutes even after the upstream-Z3 swap below, so it alone
    # gets a wider ceiling. Every other leg has run in single-digit minutes
    # since this file's own history, so leaving their budget at 25 keeps a
    # stage that genuinely hangs failing fast instead of masking it here.
    timeout-minutes: ${{ matrix.stage == 'ownership' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: warn, packages: "clang gcc-aarch64-linux-gnu gcc-mingw-w64-i686 gcc-mingw-w64-x86-64" }
          - { stage: analyze, packages: "clang clang-tidy-18" }
          - { stage: cppcheck, packages: cppcheck }
          - { stage: shell, packages: shellcheck }
          - { stage: fallible, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: locks, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: lockset, packages: clang-18 }
          - { stage: reentrancy, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: variadic, packages: clang-18 }
          - { stage: signals, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: abizeroinit, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: initproof, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: errno, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: purity, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: ownership, packages: "clang-18 libclang-18-dev llvm-18-dev pkg-config" }
          - { stage: undefined, packages: "clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: unreferenced, packages: "clang clang-18 libclang-18-dev llvm-18-dev" }
          - { stage: widthmod, packages: "" }
    name: lint (${{ matrix.stage }})
    steps:
      - uses: actions/checkout@v7
      - name: Install stage tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      # ownership is the one Z3-backed stage CI runs (sizearith/totality/
      # arithub/provenance are opt-in and not in this matrix), and it was
      # timing out here: ubuntu-24.04's apt libz3-dev is 4.8.12-3.1build1 --
      # frozen since well before this project existed -- while the
      # path-sensitive proofs this stage runs are exactly the workload Z3's
      # solver-internals releases since then have targeted (LP/arithmetic
      # solver rewrites, nlsat projection algorithm changes, HNF pivoting
      # and LRA model-init allocation reductions, among many others --
      # see https://github.com/Z3Prover/z3/blob/master/RELEASE_NOTES.md).
      # Rather than add a PPA or build Z3 from source (this project's own
      # flake.nix already avoids that -- see its pkgs.z3 comment), fetch
      # the Z3 project's own prebuilt release for exactly this runner's
      # glibc: ubuntu-24.04 ships glibc 2.39 (see
      # https://packages.ubuntu.com/noble/libc6), which is precisely the
      # target of upstream's "x64-glibc-2.39" release asset -- no
      # compilation, no ABI guessing. The archive ships no .pc file, so one
      # is synthesized here and pointed to via PKG_CONFIG_PATH, which is
      # all tools/lint.sh's `pkg-config --cflags --libs z3` needs; libz3.so
      # has no other runtime dependency ubuntu-24.04 lacks by default
      # (libstdc++6/libgcc-s1/libc6, all already present), so LD_LIBRARY_PATH
      # alone -- no `ldconfig`, no system install -- is enough for clang-18
      # to dlopen() the plugin that links against it later in this job.
      - name: Install upstream Z3 (ownership stage)
        if: matrix.stage == 'ownership'
        env:
          Z3_VERSION: 5.1.0
          # Pinned to the z3-5.1.0-x64-glibc-2.39.zip asset of the
          # Z3Prover/z3 "z3-5.1.0" GitHub release, cross-checked against
          # that release's own API-reported digest (and its 54326027-byte
          # size) as well as two independent local downloads -- not
          # derived from anything fetched at CI time, so a compromised or
          # MITM'd asset is caught here rather than trusted straight into
          # every ownership run's proof toolchain. Update this alongside
          # Z3_VERSION and the asset name below if the pinned release ever
          # bumps.
          Z3_SHA256: f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a
        run: |
          set -eu
          z3_dir="$RUNNER_TEMP/z3-$Z3_VERSION"
          asset="z3-$Z3_VERSION-x64-glibc-2.39"
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" \
            "https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/$asset.zip"
          echo "$Z3_SHA256  $RUNNER_TEMP/z3.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$asset" "$z3_dir"
          mkdir -p "$z3_dir/pkgconfig"
          # z3.pc: upstream's own release archive does not carry one (it is
          # not built via the autotools/meson path Debian's package is), so
          # pkg-config needs one describing where this archive actually put
          # things -- headers under include/, both libz3.so and the linker
          # name under bin/ (not lib/), matching this release layout as
          # inspected from the archive's own file listing.
          pc="$z3_dir/pkgconfig/z3.pc"
          {
            echo "prefix=$z3_dir"
            echo 'libdir=${prefix}/bin'
            echo 'includedir=${prefix}/include'
            echo
            echo 'Name: z3'
            echo 'Description: Z3 Theorem Prover'
            echo "Version: $Z3_VERSION"
            echo 'Libs: -L${libdir} -lz3'
            echo 'Cflags: -I${includedir}'
          } > "$pc"
          {
            echo "PKG_CONFIG_PATH=$z3_dir/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=$z3_dir/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
      - name: Run lint stage
        env:
          CLANG_TIDY: clang-tidy-18
          LINT_TIDY_EXACT: "1"
        run: tools/lint.sh ${{ matrix.stage }}
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs-${{ matrix.stage }}
          path: obj/lint/
          if-no-files-found: warn

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Run AddressSanitizer and UBSan suite
        # capability.overcommit=yes, explicitly.  The Makefile's
        # TEST_PROFILE default declares `no`, because the machine this
        # project is developed on has vm.overcommit_memory=2 and no
        # ASan-linked binary can start there (tools/asan-available.sh).
        # These runners have the default overcommit setting, so ASan runs
        # for real here -- and THIS JOB IS THE ONLY PLACE IT DOES, which
        # makes it the sole authority for heap-overflow, use-after-free,
        # double-free and leak findings.  Saying it here rather than
        # relying on asan-available.sh's stale-declaration veto is the
        # difference between a stated intent and a lucky one.
        env:
          TEST_PROFILE: capability.overcommit=yes
        run: make ARCH=x86_64 asan
      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asan-output
          path: obj/asan/test/*.out
          if-no-files-found: warn
